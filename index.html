    <script>
      (function () {
        try {
          if (localStorage.getItem('techy_billbook_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) {
                var scriptUrl = (reg.active && reg.active.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || '';
                if (scriptUrl.indexOf('dev-sw') !== -1) {
                  reg.unregister().then(function (ok) {
                    if (ok && !sessionStorage.getItem('__dev_sw_cleared')) {
                      sessionStorage.setItem('__dev_sw_cleared', '1');
                      window.location.reload();
                    }
                  });
                }
              });
            });
          }
        } catch (e) {}
      })();
